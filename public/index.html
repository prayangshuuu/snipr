<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>snipr — URL Shortener</title>
  <meta name="description" content="snipr is a minimal, anonymous URL shortener. Shorten links instantly — no signup required." />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>snipr</h1>
      <p class="tagline">Shorten any link. No signup. No tracking.</p>
    </header>

    <!-- Bento grid -->
    <div class="bento">

      <!-- Large cell: Shorten form -->
      <div class="card card-shorten">
        <h2>Shorten a URL</h2>
        <form id="shorten-form" autocomplete="off">
          <input
            type="url"
            id="url-input"
            placeholder="https://example.com/very/long/url"
            required
          />
          <input
            type="text"
            id="alias-input"
            placeholder="Custom alias (optional)"
            maxlength="32"
          />
          <button type="submit" id="shorten-btn">Shorten</button>
        </form>
        <p id="form-error" class="error" hidden></p>
      </div>

      <!-- Result cell: appears after shortening -->
      <div class="card card-result" id="result-card" hidden>
        <h2>Your short link</h2>
        <div class="result-row">
          <input type="text" id="short-url" readonly />
          <button id="copy-btn" type="button">Copy</button>
        </div>
        <p id="original-url" class="muted"></p>
      </div>

      <!-- Small cell: total links -->
      <div class="card card-count">
        <span class="card-label">Links created</span>
        <span class="card-value" id="total-count">—</span>
      </div>

      <!-- Small cell: stats lookup -->
      <div class="card card-stats">
        <h2>Look up stats</h2>
        <div class="stats-row">
          <input type="text" id="stats-input" placeholder="Paste a code" />
          <button id="stats-btn" type="button">Look up</button>
        </div>
        <div id="stats-result" hidden>
          <p>Clicks: <strong id="stats-clicks">0</strong></p>
          <p class="muted" id="stats-url"></p>
        </div>
        <p id="stats-error" class="error" hidden></p>
      </div>

    </div><!-- /.bento -->
  </div>

  <script src="/app.js"></script>
</body>
</html>
