version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE_URL=http://localhost:3000
      - DATABASE_URL=postgresql://snipr_user:snipr_pass@db:5432/snipr
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=snipr_user
      - POSTGRES_PASSWORD=snipr_pass
      - POSTGRES_DB=snipr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically run the initialization script on first startup
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snipr_user -d snipr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
